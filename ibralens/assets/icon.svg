<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="0.55" stop-color="#121217"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2b3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f52"/>
      <stop offset="1" stop-color="#1b1d27"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d5a"/>
      <stop offset="1" stop-color="#a3101c"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#cfd6ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff2b3a" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9ccd6"/>
      <stop offset="1" stop-color="#7d8091"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b48"/>
      <stop offset="1" stop-color="#8e0c17"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="440" cy="440" r="200"/></clipPath>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="460" cy="460" r="430" fill="url(#glow)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- back photo card -->
  <g transform="rotate(-10 560 470)" filter="url(#shadow)">
    <rect x="380" y="250" width="420" height="330" rx="40" fill="#1a1c25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5"/>
    <rect x="410" y="280" width="360" height="270" rx="22" fill="url(#photo)"/>
    <circle cx="700" cy="340" r="32" fill="#ffd2d5" opacity="0.9"/>
    <path d="M410 550 L520 420 L590 495 L650 440 L770 550 Z" fill="url(#mount)"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#shadow)">
    <path d="M585 585 L770 770" stroke="url(#handle)" stroke-width="86" stroke-linecap="round"/>
    <path d="M600 600 L760 760" stroke="#ffffff" stroke-opacity="0.25" stroke-width="18" stroke-linecap="round"/>
    <circle cx="440" cy="440" r="222" fill="#0b0c12" fill-opacity="0.55"/>
    <g clip-path="url(#lensClip)">
      <!-- magnified photo inside lens -->
      <rect x="200" y="200" width="480" height="480" fill="#22263a"/>
      <circle cx="530" cy="330" r="46" fill="#ffd2d5" opacity="0.9"/>
      <path d="M220 700 L380 470 L490 600 L560 520 L720 700 Z" fill="url(#mount)"/>
      <!-- scan line -->
      <rect x="200" y="452" width="480" height="10" fill="#ff5a66" opacity="0.9"/>
      <rect x="200" y="420" width="480" height="40" fill="#ff5a66" opacity="0.15"/>
      <circle cx="440" cy="440" r="200" fill="url(#lens)"/>
    </g>
    <circle cx="440" cy="440" r="211" fill="none" stroke="url(#ring)" stroke-width="30"/>
    <path d="M300 340 A160 160 0 0 1 380 268" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- glass gloss -->
  <g clip-path="url(#tileClip)">
    <path d="M64 64 H960 V380 Q512 470 64 380 Z" fill="url(#gloss)"/>
  </g>
</svg>
